    path: outputs/figures/BQ44_transition_domains.svg
    png: outputs/figures/BQ44_transition_domains.png
    question: "How common is a career transition into data - and does anyone arrive from marketing?"
    answer: "Rare in public evidence and almost absent from marketing: 12.2% of bio-declared accounts name a business background, while marketing is named by 10 of 872 - but GitHub does not narrate careers (3.4 % state a transition at all), so this is evidence of silence, not evidence of absence, and the transition story is one the CV and LinkedIn must carry because the code cannot."
