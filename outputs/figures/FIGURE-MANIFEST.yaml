    data_signature: bivariate-simple
    units: "share of accounts"
    tables: [C22b_prior_domains.csv, C22_transition_signals.csv, C22d_marketing_named_bios.csv]
    caveat: "Prior domain is detected from bio wording only. Transitioners who do not write about their past are invisible here, which is the most likely explanation for the low counts."
