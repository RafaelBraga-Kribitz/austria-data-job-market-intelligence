  - chart_id: BQ45_skill_premium_controlled
    path: outputs/figures/BQ45_skill_premium_controlled.svg
    png: outputs/figures/BQ45_skill_premium_controlled.png
    question: "Do the better-paying skills actually pay better, or am I just looking at which family names them?"
    answer: "Mostly the latter: after controlling for role family, seniority and state, 14 of 16 skills have intervals straddling zero - Python's raw +4 % becomes -2 % - and only Excel (-10 %) and Cloud (generic) (+8 %) still separate from zero. After a Holm correction over all 16 skills none clears zero (Excel and Cloud (generic) do not); Benjamini-Hochberg keeps 0 of 2. The floor is set by the family and the seniority label, not by the tool named in the advertisement."
    relationship: "uncertainty"
    mark: error_bars
    data_signature: interval-range
    units: "percent"
    tables: [D05_skill_salary_premium.csv]
    caveat: "Advertised minimums, not pay. Employer size, industry and hours basis are not controlled, the intervals shown are uncorrected (the adjusted p-values are in D05), and R² is low - this bounds how much of the raw gap is composition, it does not price a skill."
