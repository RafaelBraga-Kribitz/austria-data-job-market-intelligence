    units: "share of repositories"
    tables: [C14c_repository_archetypes.csv, C14d_data_repo_activity.csv]
    caveat: "Archetypes are rule-based and mutually exclusive by priority order; 'inactive' measures the last push date, which says nothing about whether the work was good when it was made."
